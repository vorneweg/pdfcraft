[package]
name = "pdfcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
typst = "0.14.2"
typst-eval = "0.14.2"
typst-kit = { version = "0.14.2", features = [
  "fonts",
  "packages",
  "embed-fonts",
] }
typst-layout = "0.14.2"
typst-pdf = "0.14.2"
